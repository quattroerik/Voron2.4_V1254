[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}


[gcode_macro PARK_SWITCH_OFF]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
      #not homed -> dont move!
    {% else %}
          G91
          G0 Z5
          G90
          G0 X148 Y25 F15000 # (minimize sag of gantry)
          #turn off heating
          TURN_OFF_HEATERS
          STATUS_OFF
          ##turn off motors
          M84
          #turn off electronics fan
          SET_FAN_SPEED FAN=electronics SPEED=0
    {% endif %}

[gcode_macro CHANGE_NOZZLE]
gcode:
    M104 S145 # set inital hotent temperature
    _CG28 #home if not already homed
    _CQGL #qgl if not done already
    {% set target_z = 125 %}
    {% set current_z = printer.toolhead.position.z %}
    {% if current_z < target_z %}
      G0 Z{target_z} F3000
    {% endif %}
    M109 S225
    G1 E-50 F300
    G1 X150 Y5 F15000



  
[gcode_macro CUSTOM_BACKLASH]
description: DO BACKLASH COMP for all positions
gcode:
    _CG28 #home if not already homed
    _CQGL #QGL if not alreay QGL
    G90
    G0 Z10

    RESPOND MSG="Front left"
    G0 X20 Y5 F15000
    CARTOGRAPHER_ESTIMATE_BACKLASH

    RESPOND MSG="Back left"
    G0 Z5
    G0 X20 Y250 F15000
    CARTOGRAPHER_ESTIMATE_BACKLASH

    RESPOND MSG="Back right"
    G0 Z5
    G0 X275 Y250 F15000
    CARTOGRAPHER_ESTIMATE_BACKLASH

    RESPOND MSG="Front right"
    G0 Z5
    G0 X275 Y5 F15000
    CARTOGRAPHER_ESTIMATE_BACKLASH

    RESPOND MSG="Center"
    G0 Z5
    G0 X150 Y150 F15000
    CARTOGRAPHER_ESTIMATE_BACKLASH


[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle on the brush
gcode:
    STATUS_CLEANING

    _CG28 #home if not already homed
    _CQGL #QGL if not already QGL

    {% set brush_clean_accel = 1500 %}
    {% set brush_over_y_axis = True %}
    {% set brush_size = 35 %}
    {% set brushes = 6 %}
   
    {% set St = 300 * 60 %}
    {% set Sz = 15 * 60 %}
    {% set Sc = 100 * 60 %}

    {% set Bx = 40 %} #center of the brush
    {% set By = 301.5 %}
    {% set Bz = 1 %}


    # Set the cleaning acceleration prior to any movement
    {% set saved_accel = printer.toolhead.max_accel %}
    SET_VELOCITY_LIMIT ACCEL={brush_clean_accel}

    # Move to purge zone (left side)
    G90

    #Move over Purge Bucket
    G0 X15 Y303 F12000
    
    # Move to center of the brush
    G1 X{Bx} Y{By} F{St}
    G1 Z{Bz} F{St}
    # Wipe procedure
    G91
    {% if brush_over_y_axis %}
        {% for wipe in range(brushes) %}
            G1 Y-4 F{Sc}
            G1 Y+4 F{Sc}
        {% endfor %}
    {% endif %}

    # Move to the right side of the brush
    G1 X+{ (brush_size/2)} F{Sc}
  
    # Brush procedure
    {% for wipe in range(brushes) %}
        G1 X-{ (brush_size) } F{Sc}
        G1 X+{ (brush_size) } F{Sc}
    {% endfor %}

    G90

    # Reset acceleration values to what it was before
    SET_VELOCITY_LIMIT ACCEL={saved_accel}

    #Move away from brush
    G0 Z5 F6000



[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        _CG28
        QUAD_GANTRY_LEVEL
        G28 Z        
    {% endif %}

[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING                                         # Set LEDs to homing-mode
        SET_FAN_SPEED FAN=electronics SPEED=0.45 # power on electronics fan
        G28 ; home if not already homed
    {% endif %}


[gcode_macro _SERVICE_POSITION]
gcode:
    _CG28
    G90
    G1 X150 Y25 Z117

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.0  # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}


#from ellis print tuning guide
#https://ellis3dp.com/Print-Tuning-Guide/articles/useful_macros/dump_variables.html
[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}



[gcode_macro _MY_CUSTOM_PARK_MACRO]
gcode:
  {% set restore = params.RESTORE|default("0")|int %}
  {% set x = params.X|default("150")|float %}
  {% set y = params.Y|default("150")|float %}
  {% set f = params.F|default("27000")|int %}

  {% if restore == 1 %}

    {% set cur_x = printer.gcode_move.gcode_position.x|float %}
    {% set cur_y = printer.gcode_move.gcode_position.y|float %}
    {% set cur_z = printer.gcode_move.gcode_position.z|float %}

    # Lift only if below Z=3
    {% if cur_z < 3.0 %}
      G1 Z5 F6000
    {% endif %}

    # If restoring into the cutter-pin area, always approach from Y<211
    {% if x < 3 and y >= 211 %}

      # Move to a safe X first if needed
      {% if cur_x < 3 %}
        G1 X10 F{f}
      {% endif %}

      # Approach from in front of the pin
      G1 Y212 F{f}
      G1 X{x} F{f}
      G1 Y{y} F{f}

    {% else %}

      # Normal restore
      G1 X{x} Y{y} F{f}

    {% endif %}


  {% elif ((printer.gcode_move.gcode_position.x - 38)|abs > 0.05)
        or ((printer.gcode_move.gcode_position.y - 305)|abs > 0.05) %}

    SAVE_GCODE_STATE NAME=SET_PARK_STATE

    {% set cur_x = printer.gcode_move.gcode_position.x|float %}
    {% set cur_y = printer.gcode_move.gcode_position.y|float %}
    {% set cur_z = printer.gcode_move.gcode_position.z|float %}

    # Lift only if below Z=3
    {% if cur_z < 3.0 %}
      G1 Z5 F6000
    {% endif %}

    # Cutter/depressor pin avoidance
    {% if cur_x < 3 %}

      # In front of pin
      {% if cur_y < 211 %}
        G1 X4 F{f}

      # On/behind pin
      {% elif cur_y <= 230 %}
        G1 X10 F{f}

      {% endif %}

    {% endif %}

    # Existing nozzle-wiper approach logic
    {% if (printer.gcode_move.gcode_position.y > 300)
          and (printer.gcode_move.gcode_position.x > 10) %}
      G1 Y301 F{f}
    {% endif %}

    G1 X10 F{f}
    G1 X10 Y301 F{f}
    G1 X3 Y301 F{f}

    RESTORE_GCODE_STATE NAME=SET_PARK_STATE

  {% endif %}


###########################################################################
# Shared toolhead parking macro designed to position toolhead at a suitable
# parking position, manage z-hops and retraction
#
# Standalone use, typically: _MMU_PARK FORCE_PARK=1 X= Y= Z_HOP=
#
#   FORCE_PARK=1 - force parking move
#   X | float - x coordinate of forced parking location
#   Y | float - y coordinate of forced parking location
#   Z_HOP | float - z-hop for forced parking move
#
#   OPERATION | string - define operation being performed for built-in parking
#
# derived from MMU_PARK HappyHare on 14.06.2026, modified to prevent hitting depressor pin located at X=0, Y=211 move for cutting till 226

[gcode_macro _XXXNOTUSED]
description: Park toolhead safely away from print

# -------------------------- Internal Don't Touch -------------------------
variable_saved_xyz: 0, 0, 0
variable_saved_pos: False       # Saved pos valid?
variable_park_operation: ''     # If parked, what operation was responsible
variable_next_xy: 0, 0          # Next x,y pos if next_pos is True
variable_next_pos: False        # Restore to next_pos?
variable_min_lifted_z: 0	# Supports rising "z-lifted floor" for sequential printing
variable_toolchange_z: -1	# Current calculated toolchange/movement plane
variable_retracted_length: 0	# Amount of current retraction

gcode:
    {% set vars = printer['gcode_macro _MMU_SEQUENCE_VARS'] %}
    {% set operation = params.OPERATION|default(printer.mmu.operation)|string|lower %}
    {% set is_printing = printer.mmu.print_state in ["started", "printing"] and not printer.pause_resume.is_paused %}
    {% set force_park = params.FORCE_PARK|default(0)|int == 1 %}
    {% set force_park_x = params.X|default(-999)|float %}
    {% set force_park_y = params.Y|default(-999)|float %}
    {% set enable_park_printing = (vars.enable_park_printing|default("toolchange,runout,pause,cancel")|string|lower).split(",") %}
    {% set enable_park_standalone = (vars.enable_park_standalone|default("toolchange,load,unload,pause,cancel")|string|lower).split(",") %}
    {% set enable_park_disabled = (vars.enable_park_disabled|default("pause,cancel")|string|lower).split(",") %}
    {% set nx,ny = next_xy|map('float') %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% if force_park %}
        {% set operation = 'force_park' %}
        {% set x = force_park_x %}
        {% set y = force_park_y %}
        {% set park_z_hop = params.Z_HOP|default(0)|float %}
        {% set z_hop_ramp = params.RAMP|default(0)|float %}
        {% set retract = 0 %}
    {% elif operation in ['toolchange','load','unload'] %}
        {% set x, y, park_z_hop, z_hop_ramp, retract = vars.park_toolchange|default([-999,-999,0,0,0])|map('float') %}
    {% elif operation in ['runout'] %}
        {% set x, y, park_z_hop, z_hop_ramp, retract = vars.park_runout|default([-999,-999,0,0,0])|map('float') %}
    {% elif operation in ['pause'] %}
        {% set x, y, park_z_hop, z_hop_ramp, retract = vars.park_pause|default([-999,-999,0,0,0])|map('float') %}
    {% elif operation in ['cancel'] %}
        {% set x, y, park_z_hop, z_hop_ramp, retract = vars.park_cancel|default([-999,-999,0,0,0])|map('float') %}
    {% elif operation in ['complete'] %}
        {% set x, y, park_z_hop, z_hop_ramp, retract = vars.park_complete|default([-999,-999,0,0,0])|map('float') %}
    {% else %}        
        {% set x = -999 %}
        {% set y = -999 %}
        {% set park_z_hop = 0 %}
        {% set z_hop_ramp = 0 %}
        {% set retract = 0 %}
        # --- CROSSBOW SAFETY OVERRIDE ---
        # If a generic park command attempts to target the cutter zone, 
        # redirect it safely away to prevent unintentional physical cutter drops.
        {% if x <= 3 and y < 226 and operation != 'toolchange' %}
            {% set x = 10.0 %} # Shift parking 10mm right to clear the pin
        {% endif %}
    {% endif %}
    {% set park_z_hop = park_z_hop|abs %}
    {% set z_hop_ramp = z_hop_ramp|abs %}
    {% set min_toolchange_z = vars.min_toolchange_z|default(1)|float|abs %}
    {% if x == -999 and y == -999 and park_z_hop == 0 %}
        {% set min_toolchange_z = 0 %}
    {% endif %}
    {% set park_travel_speed = vars.park_travel_speed|default(200)|float * 60 %}
    {% set park_lift_speed = vars.park_lift_speed|default(15)|float * 60 %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set max = printer.toolhead.axis_maximum %}

    # Z-hop ramp position calcs
    {% set orig_x = pos.x %}
    {% set orig_y = pos.y %}
    {% set cx = (max.x - origin.x) / 2.0 %}
    {% set cy = (max.y - origin.y) / 2.0 %}
    {% if pos.x == cx and pos.y == cy %}
        {% set target_x = 0 %}
        {% set target_y = 0 %}
    {% else %}
        {% set target_x = cx %}
        {% set target_y = cy %}
    {% endif %}
    {% set dx = target_x - pos.x %}
    {% set dy = target_y - pos.y %}
    {% set length = (dx * dx + dy * dy) ** 0.5 %}
    {% set z_hop_x = pos.x + z_hop_ramp * dx / length %}
    {% set z_hop_y = pos.y + z_hop_ramp * dy / length %}

    {% set starting_z = saved_xyz[2] if saved_pos else pos.z %}
    {% set z_hop_floor = [starting_z, min_lifted_z]|max %}
    {% set toolchange_z = [[z_hop_floor + park_z_hop, max.z - origin.z]|min, min_toolchange_z, toolchange_z]|max %}

    {% set should_park = force_park or (
        operation in (
            enable_park_disabled if not printer.mmu.enabled else
            (enable_park_printing if is_printing else enable_park_standalone)
        ) and operation != park_operation
    ) %}
    {% set should_ramp = (
        should_park and pos.z == starting_z and
        park_z_hop > 0 and z_hop_ramp > 0 and
        operation not in ['load'] and is_printing
    ) %}
    {% set should_retract = (
        should_park and
        retracted_length == 0 and retract > 0 and
        operation not in ['load']
    ) %}

    {% if should_park %}
        {% if should_retract %}
            _MMU_RETRACT LENGTH={retract}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_MY_CUSTOM_PARK_MACRO VARIABLE=toolchange_z VALUE={toolchange_z}
        {% set lift=" with ramping lift" if should_ramp else "" %}
        MMU_LOG MSG="Parking toolhead at (x:{x|round(1) if x != -999 else "n/a"}, y:{y|round(1) if y != -999 else "n/a"}, z:{toolchange_z|round(1)}){lift} for {operation} operation"
        {% if 'xy' not in printer.toolhead.homed_axes %}
            MMU_LOG MSG="Cannot park because XY not homed"
        {% else %}
            G90 # Absolute
            {% if 'z' not in printer.toolhead.homed_axes %}
                MMU_LOG MSG="Skipping z_hop move because Z not homed"
            {% else %}
                {% if should_ramp %}
                    G1 X{z_hop_x} Y{z_hop_y} Z{toolchange_z} F{park_travel_speed}	# Ramping Z lift
                    G1 X{orig_x} Y{orig_y} Z{toolchange_z} F{park_travel_speed}		# Restore starting X,Y
                {% else %}
                    G1 Z{toolchange_z} F{park_lift_speed}				# Z lift to toolchange plane
                {% endif %}
            {% endif %}
            {% if vars.user_park_move_macro %}
                {vars.user_park_move_macro} X={x} Y={y} F={park_travel_speed}
            {% elif x != -999 and y != -999 %}
                G1 X{x} Y{y} F{park_travel_speed}					# Move to park position
            {% elif x != -999 and y == -999 %}
                G1 X{x} F{park_travel_speed}						# X move only
            {% elif x == -999 and y != -999 %}
                G1 Y{y} F{park_travel_speed}						# Y move only
            {% endif %}
        {% endif %}
        {% if not force_park %}
            SET_GCODE_VARIABLE MACRO=_MY_CUSTOM_PARK_MACRO VARIABLE=park_operation VALUE=\"{operation}\"
        {% endif %}
    {% endif %}

###########################################################################
# Overriden cutting motion macro to enable immediate parking following the 
# cutting motion to reduce ooze.
#
[gcode_macro _CUT_TIP_DO_CUT_MOTION]
description: Helper to do a single cut movement
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC | float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC | float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set cutting_axis = vars['cutting_axis'] %}

    {% set pin_loc = vars['pin_loc_compressed']|default(-999)|float %}
    {% if pin_loc != -999 %}
        # Old one-dimensional pin_loc_compressed config
        {% if cutting_axis == "x" %}
            {% set pin_loc_compressed_x = pin_loc %}
            {% set pin_loc_compressed_y = pin_park_y_loc %}
        {% else %}
            {% set pin_loc_compressed_x = pin_park_x_loc %}   
            {% set pin_loc_compressed_y = pin_loc %}
        {% endif %}
    {% else %}
        # New config
        {% set pin_loc_compressed_x, pin_loc_compressed_y = vars.pin_loc_compressed_xy|map('float') %}
    {% endif %}
        
    {% set cut_fast_move_fraction = vars['cut_fast_move_fraction']|float %}
    {% set cut_fast_move_speed = vars['cut_fast_move_speed']|float %}
    {% set cut_slow_move_speed = vars['cut_slow_move_speed']|float %}
    {% set cut_dwell_time = vars['cut_dwell_time']|float %}
    {% set evacuate_speed = vars['evacuate_speed']|float %}
    {% set rip_length = vars['rip_length']|float %}
    {% set rip_speed = vars['rip_speed']|float %}
    {% set safe_margin_x, safe_margin_y = vars.safe_margin_xy|map('float') %}
    {% set travel_speed = vars['travel_speed']|float %}

    {% set fast_slow_transition_loc_x = (pin_loc_compressed_x - pin_park_x_loc) * cut_fast_move_fraction + pin_park_x_loc|float %}
    {% set fast_slow_transition_loc_y = (pin_loc_compressed_y - pin_park_y_loc) * cut_fast_move_fraction + pin_park_y_loc|float %}
    G1 X{fast_slow_transition_loc_x} Y{fast_slow_transition_loc_y} F{cut_fast_move_speed * 60} # Fast move to initiate contact of the blade with filament
    G1 X{pin_loc_compressed_x} Y{pin_loc_compressed_y} F{cut_slow_move_speed * 60} # Do the cut in slow move

    G4 P{cut_dwell_time}
    {% if rip_length > 0 %}
        G1 E-{rip_length} F{rip_speed * 60}
    {% endif %}

    G1 X{pin_park_x_loc} Y{pin_park_y_loc} F{evacuate_speed * 60} # Evacuate

    # Move clear of pin on non-cutting axis to prevent toolhead collision on subsequent travel moves
    G1 X{pin_park_x_loc + 5} F{travel_speed * 60}
    # Move to park position X/Y
    G1 X{pin_park_x_loc + 5} Y301 F{travel_speed * 60}


###########################################################################
# Overriden moving macro to prevent hitting blobifier basket and extractor pin when starting from park position
# Helper macro for tip cutting
#
[gcode_macro _CUT_TIP_MOVE_TO_CUTTER_PIN]
description: Helper to move the toolhead to the target pin in either safe or faster way, depending on toolhead clearance
gcode:
    {% set x = printer.toolhead.position.x|float %}
    {% set y = printer.toolhead.position.y|float %}
    
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC|float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC|float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}

    {% set safe_margin_x, safe_margin_y = vars.safe_margin_xy|map('float') %}
    {% set travel_speed = vars['travel_speed']|float %}
    {% set cutting_axis = vars['cutting_axis'] %}

    #check if we are in the dead zone
    {% if x < 5 %}        
        # Depressor PIN and bucket are in my way -> first X save, then Y travel
        {% if y > 212 %}            
            G1 X5 F{travel_speed * 60}
            G1 Y213 F{travel_speed * 60}
        {% endif %}
    {% endif %}
    

    {% if ((printer.gcode_move.gcode_position.x - pin_park_x_loc)|abs < safe_margin_x) or ((printer.gcode_move.gcode_position.y - pin_park_y_loc)|abs < safe_margin_y) %}
        # Make a safe but slower travel move
        {% if cutting_axis == "x" %}
            G1 X{pin_park_x_loc} F{travel_speed * 60}
            G1 Y{pin_park_y_loc} F{travel_speed * 60}
        {% else %}
            G1 Y{pin_park_y_loc} F{travel_speed * 60}
            G1 X{pin_park_x_loc} F{travel_speed * 60}
        {% endif %}
    {% else %}
        G1 X{pin_park_x_loc} Y{pin_park_y_loc} F{travel_speed * 60}
    {% endif %}